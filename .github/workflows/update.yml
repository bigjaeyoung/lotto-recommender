name: Weekly Lotto Update

on:
  schedule:
    - cron: "0 0 * * 5" # 매주 금요일 00:00 UTC = 09:00 KST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch-draws.mjs --latest
      - run: node scripts/recommend.mjs
      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/draws.json public/data/recommendation.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 주간 당첨번호/추천 갱신 $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN으로 push해도 다른 워크플로우의 push 트리거는 자동으로 실행되지 않으므로 명시적으로 호출한다.
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
