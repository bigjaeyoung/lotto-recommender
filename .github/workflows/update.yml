name: Weekly Lotto Update

on:
  schedule:
    - cron: "0 0 * * 5" # 매주 금요일 00:00 UTC = 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch-draws.mjs --latest
      - run: node scripts/recommend.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/draws.json public/data/recommendation.json
          git diff --cached --quiet || git commit -m "chore: 주간 당첨번호/추천 갱신 $(date -u +%Y-%m-%d)"
          git push
